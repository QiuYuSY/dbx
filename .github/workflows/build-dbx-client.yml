name: Build DBX desktop client (linux arm64, glibc 2.28)

# ============================================================================
# 产出：真正的桌面客户端形态（双击图标开窗口，非浏览器访问）
#   结构：Electron 28 壳（自带 Chromium，不依赖系统 WebKitGTK）
#       + dbx-web 后端二进制（zigbuild 压到 glibc 2.28）
#   Electron 启动时自动拉起后端，窗口加载本地 Web UI，退出时清理子进程。
#
# 触发：Actions -> "Build DBX desktop client (linux arm64, glibc 2.28)" -> Run
# 产物：该 run 的 Artifacts -> DBX-client-linux-arm64-glibc228
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "打包的分支 / tag / commit（默认 main）"
        required: false
        default: "main"
      electron_version:
        description: "Electron 版本（自带 Chromium，28.x 实测 glibc 基线 2.17）"
        required: false
        default: "28.3.3"

permissions:
  contents: read

concurrency:
  group: dbx-client-glibc228-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: aarch64-unknown-linux-gnu
  GLIBC_VERSION: "2.28"
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "22.23.4"
  PNPM_VERSION: "10.34.7"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build DBX client (arm64 / glibc 2.28)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    steps:
      # ---------- 1. 源码 & 工具链 ----------
      - name: Checkout dbx
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (embedded into dbx-web binary)
        run: pnpm build

      - name: Verify frontend dist
        run: test -f dist/index.html || { echo "dist/index.html missing after pnpm build" >&2; exit 1; }

      # ---------- 2. 编译后端 dbx-web，glibc 2.28 封顶 ----------
      # 走上游 mcp-release / plugin-cli-release 已验证的模式：
      # 在 ubuntu-22.04-arm 宿主上用 cargo-zigbuild，target 带 .2.28 明确封顶
      # 符号版本（zig 作为 linker 按 glibc 2.28 解析符号）。第 8 步再用
      # objdump 扫描全部 GLIBC_x.y 符号，出现 > 2.28 直接 fail 兜底。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ env.TARGET }}

      - name: Setup Python (for cargo-zigbuild)
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cargo-zigbuild + lld
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir ziglang==0.14.0 cargo-zigbuild==0.23.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld libfontconfig1-dev
          # 上游 dbx-web 的原生依赖需要 fontconfig 头文件（system-fonts 默认特性），
          # 这里 --no-default-features 不含 system-fonts，但留着头文件以防传递依赖需要。

      - name: Build dbx-web (zigbuild, glibc 2.28 ceiling)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/arm64-glibc228
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          set -euo pipefail
          echo "Building dbx-web for ${{ env.TARGET }}.${{ env.GLIBC_VERSION }} ..."
          cargo zigbuild --locked --release \
            -p dbx-web \
            --target ${{ env.TARGET }}.${{ env.GLIBC_VERSION }} \
            --no-default-features \
            --features "embed-static,duckdb-sidecar,dynamodb,mq-admin,dbx-core/sqlite-bundled"

      - name: Locate + verify backend binary
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/arm64-glibc228/${TARGET}/release/dbx-web"
          test -x "$BIN" || { echo "dbx-web binary not found at $BIN" >&2; exit 1; }
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"
          ls -lh "$BIN"
          file "$BIN" | grep -q "aarch64" || { echo "not aarch64 ELF" >&2; exit 1; }
          echo "--- max GLIBC symbol required by backend ---"
          objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -10
          BAD=$(objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu \
            | awk -F_ '{split($2,v,"."); if (v[1]>2 || (v[1]==2 && v[2]>28)) print}')
          if [ -n "$BAD" ]; then
            echo "ERROR: backend references GLIBC > 2.28:" >&2; echo "$BAD" >&2; exit 1
          fi
          echo "OK: backend glibc symbols <= 2.28"

      # ---------- 3. 下载 Electron 28 arm64 ----------
      - name: Download Electron (linux-arm64)
        shell: bash
        env:
          ELECTRON_VERSION: ${{ inputs.electron_version || '28.3.3' }}
        run: |
          set -euo pipefail
          URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-linux-arm64.zip"
          echo "Downloading $URL"
          curl -fsSL --retry 3 "$URL" -o electron.zip
          unzip -q electron.zip -d electron-dist
          echo "--- Electron GLIBC baseline check ---"
          MAX=$(strings electron-dist/electron | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "Electron main binary max GLIBC symbol: $MAX"
          echo "$MAX" | grep -qE 'GLIBC_2\.(1[0-9]|2[0-8])$' || true

      # ---------- 4. 生成 Electron 壳源码 ----------
      - name: Generate Electron app shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shell/electron-app
          cat > shell/electron-app/package.json <<'EOF'
          {
            "name": "dbx-client",
            "productName": "DBX",
            "version": "1.0.0",
            "main": "main.js",
            "description": "DBX desktop client for linux arm64 glibc 2.28"
          }
          EOF
          cat > shell/electron-app/main.js <<'EOF'
          const { app, BrowserWindow, shell, dialog } = require("electron");
          const { spawn } = require("child_process");
          const path = require("path");
          const fs = require("fs");
          const net = require("net");

          const PORT = Number(process.env.DBX_PORT || 4224);
          const HOST = "127.0.0.1";
          const URL = `http://${HOST}:${PORT}/`;
          let backend = null;
          let mainWindow = null;

          function backendBinary() {
            return path.join(process.resourcesPath, "backend", "dbx-web-bin");
          }
          function log(...a) { console.log("[DBX]", ...a); }
          function portOpen() {
            return new Promise((resolve) => {
              const s = net.createConnection({ host: HOST, port: PORT });
              const done = (v) => { s.destroy(); resolve(v); };
              s.setTimeout(500);
              s.once("connect", () => done(true));
              s.once("error", () => done(false));
              s.once("timeout", () => done(false));
            });
          }
          async function waitForBackend(ms = 30000) {
            const start = Date.now();
            while (Date.now() - start < ms) {
              if (await portOpen()) return true;
              if (backend && backend.exitCode !== null) return false;
              await new Promise((r) => setTimeout(r, 250));
            }
            return false;
          }
          function startBackend() {
            const bin = backendBinary();
            if (!fs.existsSync(bin)) {
              dialog.showErrorBox("DBX backend missing", `Cannot find:\n${bin}`);
              app.quit(); return;
            }
            fs.chmodSync(bin, 0o755);
            const dataDir = path.join(process.resourcesPath, "backend", "data");
            fs.mkdirSync(dataDir, { recursive: true });
            const env = { ...process.env, DBX_PORT: String(PORT), DBX_DATA_DIR: dataDir,
              DBX_DISABLE_PASSWORD: process.env.DBX_DISABLE_PASSWORD || "1",
              RUST_BACKTRACE: process.env.RUST_BACKTRACE || "1" };
            log("starting backend", bin, "port", PORT);
            backend = spawn(bin, [], { env, stdio: ["ignore", "pipe", "pipe"] });
            backend.stdout.on("data", (d) => log(d.toString().trim()));
            backend.stderr.on("data", (d) => log(d.toString().trim()));
            backend.on("exit", (code) => {
              log("backend exited", code); backend = null;
              if (mainWindow && !mainWindow.isDestroyed()) {
                dialog.showErrorBox("DBX stopped", `Backend exited with code ${code}.`);
                app.quit();
              }
            });
          }
          function stopBackend() {
            if (backend && backend.exitCode === null) {
              try { backend.kill("SIGTERM"); } catch (e) { log("kill error", e.message); }
            }
          }
          async function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1440, height: 900, minWidth: 960, minHeight: 640,
              title: "DBX", icon: path.join(process.resourcesPath, "icon.png"),
              show: false,
              webPreferences: { nodeIntegration: false, contextIsolation: true, sandbox: true },
            });
            mainWindow.once("ready-to-show", () => { mainWindow.show(); mainWindow.focus(); });
            mainWindow.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url); return { action: "deny" };
            });
            const ok = await waitForBackend();
            if (!ok) {
              dialog.showErrorBox("DBX failed to start", `Backend not ready on ${URL} after 30s.`);
              app.quit(); return;
            }
            log("loading", URL);
            mainWindow.loadURL(URL);
          }
          app.whenReady().then(async () => {
            startBackend();
            await createWindow();
            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });
          app.on("window-all-closed", () => { stopBackend(); if (process.platform !== "darwin") app.quit(); });
          app.on("before-quit", stopBackend);
          process.on("exit", stopBackend);
          EOF
          # 生成 256x256 PNG 图标（node 内置 zlib，无外部依赖）
          node -e '
            const zlib=require("zlib"),fs=require("fs");
            function crc(b){let c=~0;for(let i=0;i<b.length;i++){c^=b[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1));}return(~c)>>>0;}
            function ch(t,d){const T=Buffer.from(t),l=Buffer.alloc(4);l.writeUInt32BE(d.length);const c=Buffer.alloc(4);c.writeUInt32BE(crc(Buffer.concat([T,d])));return Buffer.concat([l,T,d,c]);}
            const S=256,raw=Buffer.alloc((S*4+1)*S);let p=0;
            for(let y=0;y<S;y++){raw[p++]=0;for(let x=0;x<S;x++){const rx=Math.min(x,S-1-x),ry=Math.min(y,S-1-y);const corner=(rx<40&&ry<40)?(((rx-40)**2+(ry-40)**2)<=1600):true;let r=18,g=22,b=34;if(!corner){r=g=b=0;}else if(y>=96&&y<=160&&x>=56&&x<=200){r=34;g=211;b=238;if(y>=112&&y<=144&&x>=80&&x<=150){r=18;g=22;b=34;}}raw[p++]=r;raw[p++]=g;raw[p++]=b;raw[p++]=corner?255:0;}}
            const ih=Buffer.alloc(13);ih.writeUInt32BE(S,0);ih.writeUInt32BE(S,4);ih[8]=8;ih[9]=6;
            fs.writeFileSync("shell/electron-app/icon.png",Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]),ch("IHDR",ih),ch("IDAT",zlib.deflateSync(raw)),ch("IEND",Buffer.alloc(0))]));
          '

      # ---------- 5. 组装客户端目录 ----------
      - name: Assemble client bundle
        shell: bash
        env:
          BACKEND_BIN: ${{ steps.backend.outputs.path }}
        run: |
          set -euo pipefail
          APP="DBX-linux-arm64"
          rm -rf "$APP"
          mkdir -p "$APP"
          # Electron 运行时（含 chromium、*.so、locales、resources.pak 等）
          cp -a electron-dist/. "$APP/"
          # 应用代码放 resources/app（Electron 默认入口）
          mkdir -p "$APP/resources/app" "$APP/resources/backend/data"
          cp shell/electron-app/main.js shell/electron-app/package.json "$APP/resources/app/"
          # 图标放 resources 根（main.js 从 resourcesPath 读）
          cp shell/electron-app/icon.png "$APP/resources/icon.png"
          # 后端二进制
          cp "$BACKEND_BIN" "$APP/resources/backend/dbx-web-bin"
          chmod +x "$APP/resources/backend/dbx-web-bin"
          # chrome-sandbox：设为 setuid root（有 sudo 时），否则启动脚本用 --no-sandbox
          if [ -f "$APP/chrome-sandbox" ]; then
            sudo chown root:root "$APP/chrome-sandbox" 2>/dev/null && sudo chmod 4755 "$APP/chrome-sandbox" 2>/dev/null || true
          fi
          # 启动脚本
          cat > "$APP/DBX" <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd -P "$(dirname "$0")" && pwd)"
          SANDBOX_OPT=""
          if [ -f "$HERE/chrome-sandbox" ] && [ ! -u "$HERE/chrome-sandbox" ]; then
            SANDBOX_OPT="--no-sandbox"
          fi
          cd "$HERE"
          exec "$HERE/electron" $SANDBOX_OPT "$@"
          EOF
          chmod +x "$APP/DBX"
          cat > "$APP/README.txt" <<'EOF'
          DBX desktop client — linux arm64 / glibc 2.28

          Run:
            ./DBX

          A window opens with the full DBX workbench. The backend (dbx-web)
          starts automatically on 127.0.0.1:4224 and stops when you close the window.

          First-run system libraries (Debian 10 / CentOS 7 style):
            apt:  sudo apt install libgtk-3-0 libnss3 libxss1 libasound2 \
                    libatk1.0-0 libatk-bridge2.0-0 libgbm1 libdrm2 \
                    libxkbcommon0 libx11-6 libxcomposite1 libxdamage1 \
                    libxext6 libxfixes3 libxrandr2 libpango-1.0-0 \
                    libcairo2 libnotify4 libatspi2.0-0
            yum:  sudo yum install gtk3 nss libXScrnSaver alsa-lib atk at-spi2-atk \
                    mesa-libgbm libdrm libxkbcommon libX11 libXcomposite libXdamage \
                    libXext libXfixes libXrandr pango cairo libnotify

          Env overrides:
            DBX_PORT=4224               listen port
            DBX_DISABLE_PASSWORD=1       skip login (default in this build)
            RUST_LOG=dbx_web=debug       backend logging
          EOF
          echo "--- assembled tree ---"
          du -sh "$APP"
          find "$APP" -maxdepth 2 -type f | head -30

      - name: Verify final glibc compatibility (all ELF in bundle)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking every ELF in the bundle for GLIBC > 2.28 ..."
          BAD_FOUND=0
          while IFS= read -r f; do
            MAX=$(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
            if [ -n "$MAX" ]; then
              VER=${MAX#GLIBC_}
              if awk -v v="$VER" 'BEGIN{split(v,a,"."); exit (a[1]>2 || (a[1]==2 && a[2]>28))?0:1}'; then
                echo "  TOO NEW: $MAX  $f"
                BAD_FOUND=1
              fi
            fi
          done < <(find DBX-linux-arm64 -type f \( -name 'electron' -o -name '*.so*' -o -name 'chrome-sandbox' -o -name 'dbx-web-bin' -o -name 'chrome_crashpad_handler' \))
          if [ "$BAD_FOUND" -ne 0 ]; then
            echo "ERROR: bundle contains ELF requiring GLIBC > 2.28" >&2; exit 1
          fi
          echo "OK: all bundled ELF files require GLIBC <= 2.28"

      # ---------- 6. 打包 & 上传 ----------
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -czf DBX-client-linux-arm64-glibc228.tar.gz DBX-linux-arm64
          sha256sum DBX-client-linux-arm64-glibc228.tar.gz | tee DBX-client-linux-arm64-glibc228.tar.gz.sha256
          ls -lh DBX-client-linux-arm64-glibc228.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DBX-client-linux-arm64-glibc228
          path: |
            DBX-client-linux-arm64-glibc228.tar.gz
            DBX-client-linux-arm64-glibc228.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
